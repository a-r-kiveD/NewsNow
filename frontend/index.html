<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GK Now</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo">GK NOW</div>

            <div class="streak">
                🔥 0
            </div>
        </header>


        <!-- Main content -->
        <main>

            <section class="welcome">
                <p class="small-text">WELCOME BACK</p>

                <h1>
                    Know what's<br>
                    happening.
                </h1>

                <p class="subtitle">
                    Test yourself on what's happening around the world.
                </p>
            </section>


            <!-- Today's quiz card -->
            <section class="quiz-card">

                <div class="quiz-info">
                    <span class="tag">TODAY'S QUIZ</span>

                    <h2>
                        Current Affairs
                    </h2>

                    <p>
                        10 questions · Recent news
                    </p>
                </div>

                <button class="play-button" id="playButton">
                PLAY NOW →
                </button>

            </section>


            <!-- Stats -->
            <section class="stats">

                <div class="stat-card">
                    <span>QUIZZES</span>
                    <strong>0</strong>
                </div>

                <div class="stat-card">
                    <span>BEST SCORE</span>
                    <strong>—</strong>
                </div>

            </section>

        </main>

    </div>

<script src="script.js"></script>

</body>

</html>
